name: kaggle-status

# Read only. Prints the status of each Kaggle notebook and the summary of its latest
# output, so progress can be followed from the workflow log. Never pushes anything.

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_SECRET: ${{ secrets.KAGGLE_TOKEN || secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report notebook status and output summaries
        run: |
          if [[ "$KAGGLE_SECRET" == KGAT_* ]]; then export KAGGLE_API_TOKEN="$KAGGLE_SECRET"; else export KAGGLE_KEY="$KAGGLE_SECRET"; fi
          pip install -q kaggle six
          echo "== files in savant-real"
          kaggle datasets files "${KAGGLE_USERNAME}/savant-real" || true
          for dir in kaggle/notebooks/*/; do
            slug=$(python -c "import json,sys; print(json.load(open('${dir}kernel-metadata.json'))['id'].split('/')[1])")
            echo "== ${slug}"
            kaggle kernels status "${KAGGLE_USERNAME}/${slug}" || true
            mkdir -p "out/${slug}"
            kaggle kernels output "${KAGGLE_USERNAME}/${slug}" -p "out/${slug}" -q || true
            for f in out/${slug}/*.json; do
              [ -f "$f" ] || continue
              echo "-- $(basename "$f")"
              python -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: v for k, v in d.items() if k != 'runs'}, indent=1))" "$f"
            done || echo "-- could not summarize the json output for ${slug}"
            for f in out/${slug}/runs.jsonl; do
              [ -f "$f" ] || continue
              echo "-- failed code steps in runs.jsonl"
              python - "$f" <<'PY'
          import collections, json, re, sys
          errors = collections.Counter()
          examples = []
          for line in open(sys.argv[1]):
              run = json.loads(line)
              msgs = run.get("transcript") or []
              for i, m in enumerate(msgs):
                  if m["role"] != "user" or not m["content"].startswith("<Execute>"):
                      continue
                  body = m["content"][len("<Execute>"):].removesuffix("</Execute>")
                  err = re.search(r'"error": "(.*?)"(?:,|})', body)
                  if not err or not err.group(1):
                      continue
                  errors[err.group(1)[:160]] += 1
                  code = re.search(r"<Code>(.*?)</Code>", msgs[i - 1]["content"], re.S)
                  if len(examples) < 8 and code:
                      examples.append((code.group(1).strip()[:400], err.group(1)[:200]))
          for e, n in errors.most_common(15):
              print(n, e)
          for code, err in examples:
              print("---- code\n" + code + "\n---- error\n" + err)
          print("-- endings of runs without a grounded answer")
          for line in open(sys.argv[1]):
              run = json.loads(line)
              msgs = run.get("transcript") or []
              if not msgs or run.get("grounded") is True:
                  continue
              tail = [m for m in msgs if m["role"] == "assistant"][-2:]
              notes = [m["content"][:300] for m in msgs[-4:] if m["role"] == "user"]
              print("#### " + str(run.get("task")) + " " + str(run.get("mode", "")))
              for m in tail:
                  print("assistant: " + m["content"][:600])
              for n in notes:
                  print("feedback: " + n)
          PY
            done || echo "-- could not summarize runs.jsonl for ${slug}"
            for f in out/${slug}/*.log; do
              [ -f "$f" ] || continue
              echo "-- printed output in $(basename "$f")"
              python - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1], errors="replace").read()
          # Kaggle logs are usually one JSON list, but long runs can come back as JSON
          # lines or plain text, so read whichever shape arrives.
          try:
              events = json.loads(text)
          except json.JSONDecodeError:
              events = []
              for line in text.splitlines():
                  try:
                      e = json.loads(line.strip().strip("[],"))
                  except json.JSONDecodeError:
                      continue
                  if isinstance(e, dict):
                      events.append(e)
          if not events:
              print(text[-6000:] if text.strip() else "(empty log)")
              sys.exit(0)
          out = "".join(e.get("data", "") for e in events if e.get("stream_name") == "stdout")
          print(out[-6000:])
          err = [e.get("data", "") for e in events if e.get("stream_name") == "stderr"]
          last = [line for line in err if "Error" in line][-3:]
          print("-- last errors", *last, sep="\n")
          PY
            done || echo "-- could not summarize the log for ${slug}"
          done
