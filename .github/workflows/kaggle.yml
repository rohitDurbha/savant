name: kaggle

# Publishes the held-out bench dataset (tables plus the savant wheel) and pushes the
# notebooks to Kaggle, where they run on a free GPU. Needs two repository secrets,
# KAGGLE_USERNAME and KAGGLE_TOKEN, from kaggle.com/settings under API. KAGGLE_TOKEN may
# hold either a new API token (KGAT_...) or the key from a legacy kaggle.json.

# Runs only when kaggle/RUN changes, so ordinary pushes never spend GPU quota. To start
# a run with the latest code, write a new line into kaggle/RUN and record the run in
# docs/kaggle-runs.md in the same commit.
on:
  push:
    branches: [main]
    paths: ["kaggle/RUN"]

concurrency:
  group: kaggle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_SECRET: ${{ secrets.KAGGLE_TOKEN || secrets.KAGGLE_KEY }}
    steps:
      - name: Stop early when the Kaggle secrets are missing
        if: env.KAGGLE_USERNAME == '' || env.KAGGLE_SECRET == ''
        run: |
          echo "::notice::Add KAGGLE_USERNAME and KAGGLE_TOKEN as repository secrets to publish to Kaggle."
          exit 0

      - name: Hand the credential to the Kaggle CLI in the form it expects
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_SECRET != ''
        run: |
          if [[ "$KAGGLE_SECRET" == KGAT_* ]]; then
            echo "KAGGLE_API_TOKEN=$KAGGLE_SECRET" >> "$GITHUB_ENV"
          else
            echo "KAGGLE_KEY=$KAGGLE_SECRET" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_SECRET != ''

      - uses: actions/setup-python@v5
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_SECRET != ''
        with:
          python-version: "3.12"

      - name: Build the wheel and the held-out bench tables
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_SECRET != ''
        run: |
          pip install -q . kaggle six
          rm -rf kaggle/bench/tasks kaggle/bench/*.whl
          pip wheel -q . --no-deps -w kaggle/bench
          # Seed 20261105 is the held-out bench. Tuning uses other seeds only.
          savant plant kaggle/bench/tasks --null 50 --planted 50 --hard 50 --rows 2000 --seed 20261105
          echo "${GITHUB_SHA}" > kaggle/bench/BUILD
          sed -i "s/EXPECTED_BUILD/${GITHUB_SHA}/g" kaggle/notebooks/*/notebook.ipynb
          sed -i "s/KAGGLE_USERNAME/${KAGGLE_USERNAME}/g" kaggle/bench/dataset-metadata.json \
            kaggle/notebooks/*/kernel-metadata.json

      - name: Create or version the bench dataset
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_SECRET != ''
        run: |
          if kaggle datasets status "${KAGGLE_USERNAME}/savant-bench" >/dev/null 2>&1; then
            kaggle datasets version -p kaggle/bench -m "bench from ${GITHUB_SHA::7}" -r zip
          else
            kaggle datasets create -p kaggle/bench -r zip
          fi
          # A status of ready can belong to the previous version, so wait until the
          # published BUILD file carries this commit before any notebook starts.
          for i in $(seq 1 60); do
            rm -rf /tmp/build && mkdir -p /tmp/build
            kaggle datasets download "${KAGGLE_USERNAME}/savant-bench" -f BUILD -p /tmp/build -q --force >/dev/null 2>&1 || true
            (cd /tmp/build && for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done) || true
            if [ "$(cat /tmp/build/BUILD 2>/dev/null)" = "${GITHUB_SHA}" ]; then
              echo "dataset version for ${GITHUB_SHA::7} is live"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::The new dataset version never became live."
              exit 1
            fi
            sleep 15
          done

      - name: Push the notebooks, which starts a run on Kaggle
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_SECRET != ''
        run: |
          # kaggle/RUN reads "<date> <notebook or all> <note>", so one run starts only
          # the notebook it names and never spends quota on the others.
          target=$(awk '{print $2}' kaggle/RUN)
          for dir in kaggle/notebooks/*/; do
            name=$(basename "$dir")
            if [ "$target" = "all" ] || [ "$target" = "$name" ]; then
              kaggle kernels push -p "$dir"
            fi
          done
