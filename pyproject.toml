[project]
name = "savant"
version = "0.1.0"
description = "A personal analytics engine that reports only findings that survive statistical guards"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rohit Durbha", email = "rohitdurbha@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "polars>=1.0",
  "fastexcel>=0.11",
  "pandas>=2.1",    # models write pandas far more reliably than Polars
  "pyarrow>=14",    # pandas needs it to read the Parquet handoff file
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gpu = ["transformers>=4.51", "accelerate>=0.33", "torch"]

[project.scripts]
savant = "savant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"kaggle/**/*.ipynb" = ["E501"]
